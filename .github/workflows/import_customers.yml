name: Import Customers (Manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual import)'
        required: false
        type: boolean
        default: true
      limit:
        description: 'Limit number of records (0 = all)'
        required: false
        type: number
        default: 0

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import
        env:
          SMARTSUITE_API_KEY: ${{ secrets.SMARTSUITE_API_KEY }}
          SMARTSUITE_ACCOUNT_ID: ${{ secrets.SMARTSUITE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ inputs.limit }}" != "0" ]; then
            python scripts/import_customers.py --limit ${{ inputs.limit }}
          else
            python scripts/import_customers.py
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: import-logs
          path: logs/
          retention-days: 7
