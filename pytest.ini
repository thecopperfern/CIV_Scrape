[pytest]
# Pytest configuration for CIV Enterprises Customer Prospecting System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=utils
    --cov=scripts
    --cov=config
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=20

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use mocked APIs)
    e2e: End-to-end tests (full workflow)
    slow: Slow running tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    .venv/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
